name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - name: Guard secrets files
        run: |
          tracked="$(git ls-files | grep -Ei '(^|/)dj_local_conf.*\.(json|joson)$|(^|/)dj_local_.*\.(json|joson)$' | grep -v 'Example_dj_local_conf.json' || true)"
          if [ -n "$tracked" ]; then
            echo "Refusing to run CI: local DataJoint config appears tracked:"
            echo "$tracked"
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install lint tool
        run: python -m pip install --upgrade pip ruff
      - name: Ruff (fatal checks)
        run: python -m ruff check --select E9,F63,F7,F82 adamacs tests examples

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - name: Guard secrets files
        run: |
          tracked="$(git ls-files | grep -Ei '(^|/)dj_local_conf.*\.(json|joson)$|(^|/)dj_local_.*\.(json|joson)$' | grep -v 'Example_dj_local_conf.json' || true)"
          if [ -n "$tracked" ]; then
            echo "Refusing to run CI: local DataJoint config appears tracked:"
            echo "$tracked"
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Run pytest
        env:
          PYTHONPATH: .
        run: python -m pytest -q
